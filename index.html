<!DOCTYPE html>
<html lang="en">
<head>
<script src="config.js"></script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Whore Fly</title>
<meta name="description" content="Whore Fly. She lands on everything." />
<link rel="icon" type="image/png" href="assets/img/favicon.png" />
<link rel="apple-touch-icon" href="assets/img/apple-icon.png" />
<link rel="preload" as="image" href="assets/img/hero.webp" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Overpass+Mono:wght@400;600&display=swap" rel="stylesheet" />
<style>
:root{--ink:#120c0e;--paper:#fff3f6;--pink:#f5a9c6;--rose:#ffd6e4;--red:#d9203a;--deep:#8e0f24;--dim:#7a5f68;--pad:clamp(14px,2.6vw,32px)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;overflow-x:hidden}
body{background:var(--ink);color:var(--paper);font-family:"Overpass Mono",ui-monospace,monospace;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(ellipse at 50% -10%,#3a1420,var(--ink) 60%)}
img,video{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{position:relative;z-index:1;width:min(1080px,100%);margin:0 auto;padding:var(--pad);display:grid;gap:clamp(14px,2.2vw,22px)}
/* a panel */
.panel{background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:16px;box-shadow:0 0 0 2px var(--pink),8px 8px 0 var(--deep);overflow:hidden}
.bar{display:flex;align-items:center;gap:8px;background:var(--pink);border-bottom:3px solid var(--ink);padding:9px 14px}
.bar b{width:12px;height:12px;border:2px solid var(--ink);border-radius:50%;background:var(--paper)}
.bar b:nth-child(2){background:var(--red)} .bar b:nth-child(3){background:var(--ink)}
.face{padding:clamp(16px,2.6vw,28px)}
/* hero */
.hero .face{display:grid;grid-template-columns:minmax(0,1fr) minmax(240px,360px);gap:clamp(16px,3vw,36px);align-items:center}
.wm{font-family:"Bowlby One",sans-serif;font-size:clamp(52px,9.4vw,118px);line-height:.88;letter-spacing:-.01em;color:var(--red);
  text-shadow:0 3px 0 var(--deep),0 6px 0 var(--deep),0 9px 0 #4a0512,5px 12px 0 rgba(18,12,14,.22);-webkit-text-stroke:2px var(--ink)}
.tag{margin-top:14px;font-size:clamp(16px,2vw,20px);font-weight:600;color:var(--ink)}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.btn{display:inline-flex;align-items:center;gap:9px;height:48px;padding:0 18px;border:3px solid var(--ink);border-radius:12px;background:#fff;color:var(--ink);font-family:"Bowlby One",sans-serif;font-size:15px;letter-spacing:.03em;box-shadow:4px 4px 0 var(--ink);transition:transform .1s,box-shadow .1s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.btn.go{background:var(--red);color:#fff}
.btn img{width:18px;height:18px;object-fit:contain}
.hero .pic{border:3px solid var(--ink);border-radius:16px;overflow:hidden;box-shadow:6px 6px 0 var(--ink);transform:rotate(-1.5deg);background:#000}
/* gallery */
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;perspective:900px}
.grid button{position:relative;display:block;padding:0;border:3px solid var(--ink);border-radius:12px;overflow:hidden;background:#000;box-shadow:3px 3px 0 var(--ink);transition:transform .2s,box-shadow .2s;transform-style:preserve-3d}
.grid button:nth-child(4n+1){transform:rotate(-1.2deg)} .grid button:nth-child(4n+2){transform:rotate(.8deg)} .grid button:nth-child(4n+3){transform:rotate(-.6deg)} .grid button:nth-child(4n){transform:rotate(1.1deg)}
.grid button:hover{transform:rotate(0) translate(-2px,-2px) scale(1.03);box-shadow:6px 6px 0 var(--ink);z-index:2}
.grid img{width:100%;aspect-ratio:4/3;object-fit:cover}
/* contract */
.ca-block{cursor:pointer}
dl.t{display:grid;gap:8px}
dl.t div{display:grid;grid-template-columns:120px 1fr;gap:12px;padding:8px 0;border-bottom:2px dashed var(--rose)}
dl.t dt{font-family:"Bowlby One",sans-serif;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);padding-top:3px}
dl.t dd{font-weight:600}
.ca{font-weight:600;font-size:15px;word-break:break-all;color:var(--red)}
.note{margin-top:12px;color:var(--dim);font-size:14px}
.end{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-family:"Bowlby One",sans-serif;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);padding:6px 4px 20px}
/* the fly */
#fly{position:fixed;left:0;top:0;width:84px;height:auto;z-index:40;pointer-events:none;will-change:transform;filter:drop-shadow(0 8px 10px rgba(0,0,0,.5));transform-origin:50% 60%}
/* lightbox */
.lb{position:fixed;inset:0;z-index:60;display:none;place-items:center;padding:var(--pad);background:rgba(18,12,14,.9)}
.lb.on{display:grid}
.lbin{width:min(960px,100%);background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:16px;box-shadow:0 0 0 2px var(--pink),8px 8px 0 var(--deep);overflow:hidden}
.lb img{width:100%;aspect-ratio:4/3;object-fit:cover;background:#000}
.lbbar{display:flex;align-items:center;justify-content:flex-end;gap:12px;padding:10px 14px;font-family:"Bowlby One",sans-serif;font-size:13px}
.lbnav{display:flex;gap:6px;align-items:center}
.lbnav button{width:40px;height:36px;border:2px solid var(--ink);border-radius:8px;background:#fff;font-size:18px;line-height:1}
.lbnav button:active{transform:translate(1px,1px)}
@media (max-width:820px){
  .hero .face{grid-template-columns:1fr}
  .hero .pic{max-width:320px;margin:0 auto;transform:none}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  dl.t div{grid-template-columns:1fr}
  .wm{font-size:clamp(56px,17vw,96px)}
  #fly{width:60px}
}
@media (prefers-reduced-motion:reduce){#fly{display:none}}
</style>
</head>
<body>
<img id="fly" src="assets/img/fly.png" alt="" aria-hidden="true" />
<main class="wrap">
  <section class="panel hero">
    <div class="bar"><b></b><b></b><b></b></div>
    <div class="face">
      <div>
        <h1 class="wm">Whore<br />Fly</h1>
        <p class="tag">she lands on everything</p>
        <div class="acts">
          <a class="btn go" data-link="pons" href="https://www.ponsfamily.com/launchpad"><img src="assets/img/pons.png" alt="" />Buy on Pons</a>
          <a class="btn" data-link="x" href="https://x.com" aria-label="X"><img src="assets/img/x.svg" alt="X" /></a>
        </div>
      </div>
      <div class="pic"><img src="assets/img/hero.webp" alt="Whore Fly, a glossy black fly with huge red lips, a pink boa and red heels, by a pool" /></div>
    </div>
  </section>

  <section class="panel">
    <div class="bar"><b></b><b></b><b></b></div>
    <div class="face"><div class="grid" id="grid"></div></div>
  </section>

  <section class="panel ca-block" id="cab" title="Copy contract">
    <div class="bar"><b></b><b></b><b></b></div>
    <div class="face">
      <dl class="t">
        <div><dt>Name</dt><dd data-name>Whore Fly</dd></div>
        <div><dt>Ticker</dt><dd data-ticker>$WHOREFLY</dd></div>
        <div><dt>Chain</dt><dd>Robinhood Chain &#183; Pons</dd></div>
        <div><dt>Contract</dt><dd><span class="ca" id="ca">soon</span></dd></div>
      </dl>
      <p class="note" id="cp">tap to copy</p>
      <div class="acts">
        <a class="btn go" data-link="pons" href="https://www.ponsfamily.com/launchpad"><img src="assets/img/pons.png" alt="" />Buy on Pons</a>
        <a class="btn" data-link="dex" href="https://dexscreener.com/robinhood">Chart</a>
        <a class="btn" data-link="x" href="https://x.com" aria-label="X"><img src="assets/img/x.svg" alt="X" /></a>
      </div>
    </div>
  </section>

  <div class="end"><span data-name>Whore Fly</span><span>not financial advice</span></div>
</main>

<div class="lb" id="lb"><div class="lbin"><img id="lbimg" src="" alt="" /><div class="lbbar"><span class="lbnav"><button id="lbprev" aria-label="Previous">&#8249;</button><span id="lbn" style="padding:0 6px"></span><button id="lbnext" aria-label="Next">&#8250;</button><button id="lbx" aria-label="Close">&#10005;</button></span></div></div></div>

<script>
(function(){
  var S = window.SITE, CA = (S.CA || "SOON").trim(), HAS = CA !== "SOON" && CA !== "";
  document.querySelectorAll('[data-name]').forEach(function(e){ e.textContent = S.NAME; });
  document.querySelectorAll('[data-ticker]').forEach(function(e){ e.textContent = S.TICKER; });
  document.title = S.NAME;
  document.querySelectorAll('[data-link="pons"]').forEach(function(a){ a.href = HAS ? window.PONS_HOME + '/' + CA : window.PONS_HOME; a.target = '_blank'; a.rel = 'noopener'; });
  document.querySelectorAll('[data-link="dex"]').forEach(function(a){ a.href = HAS ? window.DEX_HOME + '/' + CA : window.DEX_HOME; a.target = '_blank'; a.rel = 'noopener'; });
  document.querySelectorAll('[data-link="x"]').forEach(function(a){ a.href = S.X_URL || 'https://x.com'; a.target = '_blank'; a.rel = 'noopener'; });

  /* contract */
  var ca = document.getElementById('ca'), cp = document.getElementById('cp');
  ca.textContent = HAS ? CA : 'soon';
  document.getElementById('cab').addEventListener('click', function(){ var old = cp.textContent; if(HAS){ if(navigator.clipboard) navigator.clipboard.writeText(CA); cp.textContent = 'copied'; } else cp.textContent = 'not yet'; setTimeout(function(){ cp.textContent = old; }, 1300); });

  /* gallery */
  var G = ['laundromat','gas','diner','nails','busstop','lobby','atm','karaoke','motel','taxi','mirror','checkout'];
  var grid = document.getElementById('grid'), cur = 0;
  grid.innerHTML = G.map(function(n, i){ return '<button data-i="' + i + '" aria-label="Open"><img src="assets/img/t-' + n + '.webp" loading="lazy" alt="" /></button>'; }).join('');
  var lb = document.getElementById('lb'), lbimg = document.getElementById('lbimg'), lbn = document.getElementById('lbn');
  function show(i){ cur = (i + G.length) % G.length; lbimg.src = 'assets/img/' + G[cur] + '.webp'; lbn.textContent = (cur + 1) + ' / ' + G.length; lb.classList.add('on'); }
  grid.addEventListener('click', function(e){ var b = e.target.closest('button'); if(b) show(+b.dataset.i); });
  document.getElementById('lbprev').onclick = function(){ show(cur - 1); };
  document.getElementById('lbnext').onclick = function(){ show(cur + 1); };
  document.getElementById('lbx').onclick = function(){ lb.classList.remove('on'); };
  lb.addEventListener('click', function(e){ if(e.target === lb) lb.classList.remove('on'); });
  addEventListener('keydown', function(e){ if(!lb.classList.contains('on')) return; if(e.key === 'Escape') lb.classList.remove('on'); if(e.key === 'ArrowLeft') show(cur - 1); if(e.key === 'ArrowRight') show(cur + 1); });

  /* the fly: she buzzes around and lands where you tap */
  var fly = document.getElementById('fly'), x = innerWidth * .7, y = innerHeight * .3, vx = 0, vy = 0, tx, ty, land = 0, jit = 0, last = performance.now();
  function pick(){ tx = 40 + Math.random() * (innerWidth - 120); ty = 40 + Math.random() * (innerHeight - 140); }
  pick();
  addEventListener('pointerdown', function(e){ if(e.target.closest('a,button')) return; tx = e.clientX; ty = e.clientY; land = 1; });
  function step(now){
    var dt = Math.min(.05, (now - last) / 1000); last = now;
    var dx = tx - x, dy = ty - y, d = Math.hypot(dx, dy) || 1;
    if(land === 2){ jit = 0; }
    else {
      var acc = land ? 2600 : 1400;
      vx += (dx / d) * acc * dt + (Math.random() - .5) * 900 * dt; vy += (dy / d) * acc * dt + (Math.random() - .5) * 900 * dt;
      var sp = Math.hypot(vx, vy), max = land ? 900 : 520; if(sp > max){ vx *= max / sp; vy *= max / sp; }
      x += vx * dt; y += vy * dt; jit = (Math.random() - .5) * 8;
      if(d < 18){ if(land){ land = 2; vx = vy = 0; setTimeout(function(){ land = 0; pick(); }, 2200 + Math.random() * 1800); } else pick(); }
    }
    x = Math.max(20, Math.min(innerWidth - 20, x)); y = Math.max(20, Math.min(innerHeight - 20, y));
    var w = fly.offsetWidth || 84, h = fly.offsetHeight || 77;
    fly.style.transform = 'translate(' + (x - w / 2) + 'px,' + (y - h * .6) + 'px) rotate(' + ((land === 2 ? 0 : vx * .03) + jit) + 'deg) scaleX(' + (vx < -40 ? -1 : 1) + ')';
    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
})();
</script>
</body>
</html>
